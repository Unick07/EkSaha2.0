<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6FAF9" />
    <meta name="color-scheme" content="light dark" />
    <!--seo:start-->
    <title data-seo="title">EkSaha | On-Demand SEO, Web, Ads & IT Support</title>
    <meta data-seo="description" name="description" content="Grow with one flexible digital team for SEO, web development, paid advertising and IT support—without adding full-time headcount." />
    <meta data-seo="robots" name="robots" content="index, follow" />
    <link data-seo="canonical" rel="canonical" href="https://eksaha.com/" />
    <meta data-seo="og:site_name" property="og:site_name" content="EkSaha" />
    <meta data-seo="og:type" property="og:type" content="website" />
    <meta data-seo="og:title" property="og:title" content="EkSaha | On-Demand SEO, Web, Ads & IT Support" />
    <meta data-seo="og:description" property="og:description" content="Grow with one flexible digital team for SEO, web development, paid advertising and IT support—without adding full-time headcount." />
    <meta data-seo="og:url" property="og:url" content="https://eksaha.com/" />
    <meta data-seo="og:image" property="og:image" content="https://eksaha.com/brand/eksaha-social-card.png" />
    <meta data-seo="og:image:alt" property="og:image:alt" content="EkSaha on-demand digital team" />
    <meta data-seo="twitter:card" name="twitter:card" content="summary_large_image" />
    <meta data-seo="twitter:title" name="twitter:title" content="EkSaha | On-Demand SEO, Web, Ads & IT Support" />
    <meta data-seo="twitter:description" name="twitter:description" content="Grow with one flexible digital team for SEO, web development, paid advertising and IT support—without adding full-time headcount." />
    <meta data-seo="twitter:image" name="twitter:image" content="https://eksaha.com/brand/eksaha-social-card.png" />
    <meta data-seo="twitter:image:alt" name="twitter:image:alt" content="EkSaha on-demand digital team" />
    <!--seo:end-->
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/brand/eksaha-icon.svg" />
    <script>
      (() => {
        let preference = "system";
        let savedTheme = "light";

        try {
          const savedState = JSON.parse(localStorage.getItem("eksaha-app"))?.state;
          preference = savedState?.themePreference || "system";
          savedTheme = savedState?.theme || "light";
        } catch {
          // A malformed preference should never prevent the application loading.
        }

        const systemDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const appDarkMode = preference === "manual"
          ? savedTheme === "dark"
          : systemDarkMode;
        const favicon = document.getElementById("app-favicon");
        const themeColor = document.querySelector('meta[name="theme-color"]');

        document.documentElement.classList.toggle("dark", appDarkMode);
        document.documentElement.style.colorScheme = appDarkMode ? "dark" : "light";
        favicon.href = systemDarkMode ? "/brand/eksaha-icon-white.svg" : "/brand/eksaha-icon.svg";
        themeColor.content = appDarkMode ? "#111827" : "#F6FAF9";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
